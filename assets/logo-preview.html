<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peek, brand starter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F7F6F2;color:#202923;font-family:system-ui,-apple-system,sans-serif}main{max-width:880px;margin:auto;padding:64px 24px}.eyebrow{font-size:12px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:#58635B}.hero{padding:64px 0 56px;text-align:center}.mascot{display:block;width:192px;height:160px;margin:0 auto 20px}.word{width:154px;height:56px}h1{font-size:clamp(26px,5vw,38px);font-weight:600;letter-spacing:-.035em;margin:30px 0 12px}p{color:#58635B;line-height:1.6}.line{border-top:1px solid #DADFD7;padding-top:28px;display:flex;gap:40px;flex-wrap:wrap;align-items:center}.sample{display:flex;align-items:center;gap:18px}.swatches{display:flex;gap:8px;margin-left:auto}.swatches i{display:block;width:32px;height:32px;border-radius:50%}footer{margin-top:40px;font-size:13px;color:#58635B}a{color:#286344}
</style>
<main>
<div class="eyebrow">Peek / identity starter</div>
<section class="hero">
<img class="mascot" src="logo.svg" alt="Two little characters peeking at each other">
<img class="word" src="wordmark.svg" alt="Peek">
<h1>A little guessing. A little luck.</h1>
<p>Two players. One secret each.<br>Find theirs first.</p>
</section>
<div class="line">
<div class="sample"><img src="logo-mono.svg" width="48" height="40" alt="Single-color mark"><span>Small, simple, friendly.</span></div>
<div class="swatches" aria-label="Ink, leaf, sage, and apricot palette"><i style="background:#202923"></i><i style="background:#286344"></i><i style="background:#A6C9A5"></i><i style="background:#EDBB91"></i></div>
</div>
<footer>Brand preview only, the game is not implemented. Original vector assets: <a href="logo.svg">mascot</a> · <a href="logo-mono.svg">single color</a> · <a href="wordmark.svg">wordmark</a>.</footer>
</main>
</html>
